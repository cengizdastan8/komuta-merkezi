## 3. `fast_recall_native.c` İçin &quot;16-Kelime OR Tuzağını&quot; Kökten Çözen C + SQLite Tasarımı

`ChatGPT Work Sol Ultra 6/6`, `ChatGPT Sohbet Pro 5/5`, `Lokal Codex` ve `İkiz AGY 2`&#x27;nin 2. Turda vardığı en parlak mühendislik sonucu şudur:
- **Ham FTS5 `OR` aramasını sıcak yetenek seçim yolundan çıkar!**
- Neden? Çünkü FTS5&#x27;e kullanıcı mesajının ilk 16 kelimesini `OR` ile verdiğinde sohbet kelimeleri teknik terimleri dışarı iter. Stop-word listesi eklemek yardımcı olur ama tek başına çok kelimeli teknik kavramları (`&quot;çoklu dokunma&quot;` = `&quot;multi touch&quot;`, `&quot;atomik kayıt&quot;` = `&quot;atomic save&quot;`, `&quot;C++&quot;`, `&quot;C#&quot;`, `&quot;.NET&quot;`) koruyamaz.
- **Kesin Çözüm (`02-work-turn2-ekler/tokenizer.c` &amp; `selector.c`):**
  1. C okuyucusu (`tb_concepts`), mesajın **ilk 16 kelimesini değil, tamamını** (64 KiB&#x27;a kadar, sıfır heap allocation ile) tarar, Türkçe karakterleri (`İ/ı/ğ/ü/ş/ö/ç`) normalize eder ve `C++`, `C#`, `.NET`, `fast_recall_native.c` içindeki `+#._` karakterlerini korur.
  2. Girdideki tekli ve ikili/üçlü kelimeleri **Sürümlü Teknik Kavram Sözlüğü (`Concept Alias Table`)** ile eşleştirip benzersiz tam sayı **`concept_id` (`1..N`)** listesine çevirir. Böylece mesajın başında 200 kelimelik günlük sohbet olsa bile sözlükte olmadığı için anında atlanır; 201. kelimedeki `&quot;Expo React Native&quot;` veya `&quot;pointercancel&quot;` %100 yakalanır!
